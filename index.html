<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Catch Game</title>
<style>
  body { margin: 0; background: #111; display: flex; justify-content: center; }
  canvas { border: 2px solid white; }
</style>
</head>
<body>

<canvas id="canvas" width="640" height="480"></canvas>

<script>
const canvasElement = document.getElementById('canvas');
const ctx = canvasElement.getContext('2d');

let score = 0;
let gameState = "START";
let startTime = null;
const GAME_DURATION = 30;

const width = 640, height = 480;

// Player position, controlled by arrow keys
let px = width / 2, py = height / 2;
const PLAYER_SPEED = 6;
const keys = {};

function makeObject() {
  return {
    x: Math.random() * (width - 100) + 50,
    y: Math.random() * -200,
    speed: Math.random() * 5 + 4
  };
}

let objects = Array.from({length: 5}, makeObject);

function update() {
  if (gameState === "PLAYING") {
    // Move player based on held keys
    if (keys["ArrowLeft"]) px -= PLAYER_SPEED;
    if (keys["ArrowRight"]) px += PLAYER_SPEED;
    if (keys["ArrowUp"]) py -= PLAYER_SPEED;
    if (keys["ArrowDown"]) py += PLAYER_SPEED;

    px = Math.max(15, Math.min(width - 15, px));
    py = Math.max(15, Math.min(height - 15, py));
  }
}

function draw() {
  ctx.clearRect(0, 0, width, height);

  if (gameState === "START") {
    ctx.fillStyle = "white";
    ctx.font = "30px Arial";
    ctx.fillText("Press SPACE to start", 80, 240);
    ctx.font = "18px Arial";
    ctx.fillText("Use arrow keys to move", 100, 280);

  } else if (gameState === "PLAYING") {
    const elapsed = (Date.now() - startTime) / 1000;
    const remaining = Math.max(0, Math.ceil(GAME_DURATION - elapsed));
    const speedBonus = Math.floor(elapsed / 5);

    if (elapsed > GAME_DURATION) {
      gameState = "GAME_OVER";
    }

    // Draw player
    ctx.beginPath();
    ctx.arc(px, py, 15, 0, 2 * Math.PI);
    ctx.fillStyle = "lime";
    ctx.fill();

    // Update and draw falling objects
    objects.forEach(obj => {
      obj.y += obj.speed;

      const dist = Math.sqrt((px - obj.x) ** 2 + (py - obj.y) ** 2);

      if (dist < 30) {
        score += 1;
        obj.y = Math.random() * -100;
        obj.x = Math.random() * (width - 100) + 50;
        obj.speed = Math.random() * 5 + 4 + speedBonus;
      }

      if (obj.y > height) {
        obj.y = Math.random() * -100;
        obj.x = Math.random() * (width - 100) + 50;
        obj.speed = Math.random() * 5 + 4 + speedBonus;
      }

      ctx.beginPath();
      ctx.arc(obj.x, obj.y, 15, 0, 2 * Math.PI);
      ctx.fillStyle = "red";
      ctx.fill();
    });

    ctx.fillStyle = "white";
    ctx.font = "24px Arial";
    ctx.fillText(`Score: ${score}`, 20, 40);
    ctx.fillText(`Time: ${remaining}`, 20, 75);

  } else if (gameState === "GAME_OVER") {
    ctx.fillStyle = "white";
    ctx.font = "28px Arial";
    ctx.fillText(`Game Over! Score: ${score}`, 60, 240);
    ctx.font = "20px Arial";
    ctx.fillText("Press R to restart", 100, 280);
  }
}

function loop() {
  update();
  draw();
  requestAnimationFrame(loop);
}

document.addEventListener('keydown', (e) => {
  keys[e.key] = true;

  if (e.code === "Space" && gameState === "START") {
    gameState = "PLAYING";
    startTime = Date.now();
    px = width / 2;
    py = height / 2;
  }
  if (e.key.toLowerCase() === "r" && gameState === "GAME_OVER") {
    gameState = "START";
    score = 0;
    startTime = null;
    objects = Array.from({length: 5}, makeObject);
  }
});

document.addEventListener('keyup', (e) => {
  keys[e.key] = false;
});

draw(); // show start screen immediately
loop();
</script>
</body>
</html>
